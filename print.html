      border: 1px solid #334155;

      background: #e2e8f0;
      font-weight: 800;
      color: #0f172a;
    }
    .pdf-report-footer {
      display: flex;

      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px dashed #64748b;
      font-size: 11px;
      font-weight: 700;
    }
    @media print {
      html, body {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        height: auto !important;
        min-height: 0 !important;

        overflow: visible !important;

        display: block !important;

        position: static !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      }
      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
      thead {
        display: table-header-group;
      }
      tfoot {
        display: table-footer-group;
      }

    function decodeBase64UrlUtf8(b64) {
      try {
        let s = String(b64).replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4 !== 0) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return '';
      }
    }

              <tr style="background:#f1f5f9;font-weight:900;">
                <td colspan="4" style="border:1px solid #000;padding:8px;text-align:center;">الإجمالي الكلي المحمل على السيارة</td>
                <td style="border:1px solid #000;padding:8px;text-align:center;">${fmtNumAr(totalSheets, 0)} قطعة</td>
                <td style="border:1px solid #000;padding:8px;text-align:center;">${fmtNumAr(totalArea, 2)} م²</td>
                <td style="border:1px solid #000;padding:8px;text-align:center;">${fmtNumAr(totalVol, 4)} م³</td>
              </tr>
            </tfoot>
          </table>

          ${d.nt ? `
            <div style="border:2px solid #000;background:#f8fafc;padding:9px 12px;border-radius:6px;margin-bottom:16px;font-size:13.5px;">
              <strong>📌 ملاحظات التحميل وأمن البوابة:</strong> ${d.nt}
            </div>
          ` : ''}

          <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:14px;margin-top:30px;text-align:center;font-weight:700;font-size:13px;">
            <div>اعتماد المحاسب للصرف<br/><br/>${d.ab || '................'}</div>
            <div>أمين المخزن / المدير الإداري<br/><br/>${d.wb || '................'}</div>
            <div>توقيع سائق السيارة بالاستلام<br/><br/>${d.dn || '................'}</div>
            <div>مسؤول أمن البوابة<br/><br/>................</div>
          </div>
        </div>
      `;
    }

    function triggerBrowserPrintNow() {
      try {
        const container = document.getElementById('standalone-print-body');
        if (container) void container.offsetHeight;
        window.focus();
        window.print();
      } catch (e) {}
    }

    function downloadDirectPdfFile() {
      const container = document.getElementById('standalone-print-body');
      if (!container || !container.innerHTML.trim()) return;
      if (typeof window.html2pdf !== 'function') {
        triggerBrowserPrintNow();
        return;
      }
      const btn = document.getElementById('btn-download-pdf');
      const oldText = btn ? btn.innerText : '';
      if (btn) btn.innerText = '⏳ جاري تجهيز الـ PDF...';
      const isSinglePageStmt = Boolean(container.querySelector('[data-single-page-statement="1"]'));
      const safeFile = (_currentDocTitle || 'مستند_مصنع_العاصمة').replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
      const worker = window.html2pdf().set({
        margin: isSinglePageStmt ? 5 : 6,
        filename: safeFile,
        pagebreak: { mode: ['css', 'legacy'] },
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: false, backgroundColor: '#ffffff', scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: window._isLandscapeDoc ? 'landscape' : 'portrait' }
      }).from(container).toPdf();

      worker.get('pdf').then((pdf) => {
        if (isSinglePageStmt && pdf && pdf.internal && typeof pdf.internal.getNumberOfPages === 'function') {
          while (pdf.internal.getNumberOfPages() > 1) {
            pdf.deletePage(pdf.internal.getNumberOfPages());
          }
        }
      }).then(() => worker.save()).then(() => {
        if (btn) btn.innerText = oldText;
      }).catch(() => {
        if (btn) btn.innerText = oldText;
        triggerBrowserPrintNow();
      });
    }

    function renderPrintDocument(rawHtml, title, landscape) {
      if (_rendered || !rawHtml) return;
      _rendered = true;
      window._isLandscapeDoc = Boolean(landscape);
      _currentDocTitle = title || 'طباعة مستند رسمي - مصنع العاصمة';
      document.title = _currentDocTitle;

      const titleEl = document.getElementById('print-bar-title');
      if (titleEl) titleEl.textContent = '🖨️ ' + _currentDocTitle;

      const styleEl = document.getElementById('page-orientation-style');
      if (styleEl) {
        styleEl.textContent = `@page { size: ${landscape ? 'A4 landscape' : 'A4 portrait'}; margin: 7mm; }`;
      }

      const loadingEl = document.getElementById('print-loading-indicator');
      if (loadingEl) loadingEl.style.display = 'none';

      const finalHtml = String(rawHtml)
        .split('__CSI_DEFAULT_LOGO__')
        .join(DEFAULT_FACTORY_LOGO_DATA_URL)
        .split('__CSI_DEFAULT_STAMP__')
        .join(DEFAULT_FACTORY_STAMP_DATA_URL);

      const bodyEl = document.getElementById('standalone-print-body');
      bodyEl.innerHTML = finalHtml;
      void bodyEl.offsetHeight;

      const imgs = Array.from(bodyEl.querySelectorAll('img'));
      const waitPromises = imgs.map(img => {
        if (img.decode) return img.decode().catch(() => {});
        if (img.complete) return Promise.resolve();
        return new Promise(res => {
          img.addEventListener('load', res, { once: true });
          img.addEventListener('error', res, { once: true });
        });
      });

      Promise.race([
        Promise.all(waitPromises),
        new Promise(res => setTimeout(res, 300))
      ]).then(() => {
        if (_printedOnce) return;
        _printedOnce = true;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setTimeout(() => {
              triggerBrowserPrintNow();
            }, 180);
          });
        });
      });
    }

    async function initPrintPage() {
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job') || '';
      const orderId = params.get('orderId') || '';
      const hash = window.location.hash ? window.location.hash.slice(1) : '';
      const hashParams = new URLSearchParams(hash);

      // 1. Instant 0ms render from URL Hash (#d=compactCarJson or #h=base64Html)
      const dB64 = hashParams.get('d');
      if (dB64) {
        const jsonStr = decodeBase64UrlUtf8(dB64);
        if (jsonStr) {
          try {
            const parsed = JSON.parse(jsonStr);
            if (parsed && parsed.t === 'car') {
              const html = buildHtmlFromCompactCarJson(parsed);
              renderPrintDocument(html, `إذن صرف سيارة ${parsed.cp || parsed.on || ''}`, false);
              return;
            }
          } catch (_) {}
        }
      }

      const hB64 = hashParams.get('h');
      if (hB64) {
        const decodedHtml = decodeBase64UrlUtf8(hB64);
        if (decodedHtml) {
          renderPrintDocument(decodedHtml, params.get('title') || 'طباعة مستند رسمي - مصنع العاصمة', params.get('l') === '1');
          return;
        }
      }

      // 2. Instant 0ms render from same-origin localStorage
      try {
        const localRaw = localStorage.getItem('al_asimah_last_print_job');
        if (localRaw) {
          const localJob = JSON.parse(localRaw);
          if (localJob && localJob.html && (!jobId || localJob.jobId === jobId || (Date.now() - Number(localJob.createdAt || 0) < 60000))) {
            renderPrintDocument(localJob.html, localJob.title, localJob.landscape);
            return;
          }
        }
      } catch (_) {}

      // 3. Try local server /api/print-job (if running on localhost/LAN)
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
      if (isLocal) {
        try {
          const r = await fetch(`/api/print-job?job=${encodeURIComponent(jobId)}`, { cache: 'no-store' });
          if (r.ok) {
            const j = await r.json();
            if (j && j.html) {
              renderPrintDocument(j.html, j.title, j.landscape);
              return;
            }
          }
        } catch (_) {}
      }

      // 4. Poll Firebase Cloud print job (handles external browser opened from Antigravity built-in browser!)
      if (jobId) {
        for (let attempt = 0; attempt < 15; attempt++) {
          try {
            const fbRes = await fetch(`${FIREBASE_JOBS_BASE}/${encodeURIComponent(jobId)}.json`, { cache: 'no-store' });
            if (fbRes.ok) {
              const fbJob = await fbRes.json();
              if (fbJob && fbJob.html) {
                renderPrintDocument(fbJob.html, fbJob.title, fbJob.landscape);
                return;
              }
            }
          } catch (_) {}
          await new Promise(r => setTimeout(r, 180));
        }
      }

      // 5. Fallback: check latest print job on Firebase or build Vehicle Dispatch Voucher from Firebase state
      try {
        const latestRes = await fetch(`${FIREBASE_JOBS_BASE}/latest.json`, { cache: 'no-store' });
        if (latestRes.ok) {
          const latestJob = await latestRes.json();
          if (latestJob && latestJob.html) {
            renderPrintDocument(latestJob.html, latestJob.title, latestJob.landscape);
            return;
          }
        }
      } catch (_) {}

      try {
        const stateRes = await fetch(FIREBASE_STATE_URL, { cache: 'no-store' });
        if (stateRes.ok) {
          const st = await stateRes.json();
          const orders = (st && Array.isArray(st.productionOrders)) ? st.productionOrders : [];
          const ord = orderId
            ? orders.find(o => o.id === orderId || o.orderNumber === orderId)
            : orders.find(o => o.carDispatchVoucher);
          if (ord) {
            const car = ord.carDispatchVoucher || {};
            const compact = {
              t: 'car',
              fn: st.factoryInfo?.name || 'مصنع العاصمة للصناعات المتخصصة',
              vn: car.voucherNo || ('CAR-' + ord.orderNumber),
              on: ord.orderNumber,
              dt: car.dispatchDate || ord.date || '',
              cc: ord.clientCode || 'CL',
              cn: ord.clientName || '',
              cp: car.carPlateNumber || '',
              dn: car.driverName || '',
              dp: car.driverPhone || '',
              po: car.palletsDeliveredCount ?? 0,
              pi: car.palletsReceivedCount ?? 0,
              nt: [car.notes, ord.notes].filter(Boolean).join(' — '),
              ab: ord.accountantReleaseBy || '',
              wb: car.dispatchedBy || ord.warehousePrepApprovedBy || '',
              it: (ord.items || []).map(i => ({
                th: i.thicknessMm,
                dr: i.direction,
                gr: i.gradeName,
                l: i.lengthCm || 250,
                w: i.widthCm || 125,
                sh: i.sheetsCount || 0,
                a: i.areaM2 || 0,
                v: i.volumeM3 || 0
              }))
            };
            renderPrintDocument(buildHtmlFromCompactCarJson(compact), `إذن صرف سيارة ${car.carPlateNumber || ord.orderNumber}`, false);
            return;
          }
        }
      } catch (_) {}
    }

    initPrintPage();
  </script>
