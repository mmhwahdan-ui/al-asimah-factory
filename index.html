<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>مصنع العاصمة للصناعات المتخصصة | نظام إدارة المخازن والإنتاج والحسابات</title>
  <meta name="description" content="النظام المتكامل لإدارة مخازن وإنتاج وحسابات مصنع العاصمة للصناعات المتخصصة - إنتاج القشرة الخشبية (250×125 سم)" />
  <meta name="theme-color" content="#b45309" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="مصنع العاصمة" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
  <link rel="apple-touch-icon" href="./icons/logo.svg" />
  <link rel="stylesheet" href="./styles.css?v=15" />
  <script>
    (function() {
      var TARGET_VER = 'v15';
      if (localStorage.getItem('al_asimah_app_ver') !== TARGET_VER) {
        localStorage.setItem('al_asimah_app_ver', TARGET_VER);
        if ('caches' in window) {
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }).then(function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).finally(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          });
        }
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="print-area"></div>

  <script src="./app.js?v=15"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'FORCE_RELOAD_V15') {
          window.location.reload();
        }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=15').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
